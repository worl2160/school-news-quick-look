name: update

on:
  schedule:
    - cron: "5 22-23,0-14 * * *"   # 臺灣 06:05–22:05 每小時
    - cron: "5 15,18,21 * * *"      # 臺灣 23:05、02:05、05:05
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cp -r site out
      - run: sed -i "s/__BUILD__/${GITHUB_SHA}/" out/sw.js
      - name: Fetch every school
        run: node src/fetch/main.js --out out/data --base https://worl2160.github.io/school-news-quick-look/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
